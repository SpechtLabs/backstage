name: image

# Pull requests: build the image as a test (no push). Renovate automerges only
# once this passes.
#
# Pushes to main: release. The next version comes from the conventional
# commits since the last v* tag (breaking -> major, feat -> minor, anything
# else -> patch). The image is pushed as X.Y.Z, X.Y, sha-<commit> and latest;
# only then are the git tag and the GitHub release created, so a version never
# exists without its image. Renovate in k8s-deployment picks up X.Y.Z.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release half-way; queue it instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/spechtlabs/backstage

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release tag
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the tags and commits since the last release

      - name: Next version
        id: version
        if: github.event_name != 'pull_request'
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next=1.0.0
          elif [ -z "$(git rev-list "$last..HEAD")" ]; then
            echo "No commits since $last: building without a new version."
            next=
          else
            IFS=. read -r major minor patch <<<"${last#v}"
            log=$(git log --format='%s%n%b' "$last..HEAD")
            if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' <<<"$log"; then
              next=$((major + 1)).0.0
            elif grep -qE '^feat(\([^)]*\))?:' <<<"$log"; then
              next=$major.$((minor + 1)).0
            else
              next=$major.$minor.$((patch + 1))
            fi
          fi
          echo "Last release: ${last:-none}, next: ${next:-none}"
          echo "version=$next" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # The cluster nodes are x86 (Hetzner cx33): one platform keeps builds fast.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/backend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Renovate shows these release notes in the k8s-deployment bump PRs.
      - name: Tag and release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes

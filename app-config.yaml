app:
  title: SpechtLabs Backstage
  baseUrl: http://localhost:3000

  # Discover every frontend plugin in packages/app/package.json, except:
  # - plugin-opencost: wired up by hand (packages/app/src/modules/opencost)
  #   until a version with a new-frontend export can be installed.
  packages:
    exclude:
      - '@backstage-community/plugin-opencost'

  extensions:
    # The Home page is the landing page (/); the catalog stays at /catalog.

    # Visit tracking feeds the Most Visited and Recently Visited widgets
    # (stored through the user-settings backend).
    - api:home/visits: true
    - app-root-element:home/visit-listener: true
    - home-page-widget:home/toolkit:
        config:
          tools:
            - url: https://argocd.k8s.specht-labs.de
              label: ArgoCD
              icon: kind:system
            - url: https://spechtlabs.grafana.net
              label: Grafana
              icon: dashboard
            - url: https://github.com/SpechtLabs
              label: GitHub
              icon: github
            - url: https://github.com/SpechtLabs/k8s-deployment
              label: k8s-deployment
              icon: github
            - url: https://github.com/SpechtLabs/backstage
              label: Backstage repo
              icon: github
    # Demo widgets from the scaffold. The joke one fetches a public API from
    # the browser and fails whenever that API is down.
    - home-page-widget:home/random-joke: false
    - home-page-widget:home/world-clock: false
    - page:home:
        config:
          path: /
          defaultConfig:
            - component: HomePageSearchBar
              column: 0
              row: 0
              width: 12
              height: 2
              deletable: false
            - component: Welcome
              column: 0
              row: 2
              width: 4
              height: 8
            - component: HomePageStarredEntities
              column: 4
              row: 2
              width: 4
              height: 4
            - component: HomePageToolkit
              column: 8
              row: 2
              width: 4
              height: 4
            - component: HomePageRecentlyVisited
              column: 4
              row: 6
              width: 4
              height: 4
            - component: HomePageMostVisited
              column: 8
              row: 6
              width: 4
              height: 4

organization:
  name: SpechtLabs

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection: ':memory:'
  actions:
    # The plugins whose actions become MCP tools (mcpActions below). Not the
    # scaffolder: its execute-template creates GitHub repos through the
    # GitHub App.
    pluginSources:
      - catalog
      - kubernetes
      - search
      - techdocs
      - auth
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest: {}
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  # MCP clients (Claude, Cursor, VS Code, Codex) sign in through this: the
  # client asks Backstage for a token, you approve it in Backstage after the
  # usual tsidp sign-in. No static token to hand out.
  clientIdMetadataDocuments:
    enabled: true
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Domain]
    # No Tailscale here: the cluster config registers the one directory the
    # policy may come from as a location of its own, with a rule for just
    # that location. Rules match an entity's origin location, so nothing
    # GitHub discovery or another Location reads can grant anyone anything.
  locations:
    # Local example data, file locations are relative to the backend process, typically `packages/backend`
    - type: file
      target: ../../examples/entities.yaml

    # Local example template
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# see https://backstage.io/docs/ai/mcp-actions for more details
# MCP: /api/mcp-actions/v1 serves the actions of the plugins in
# backend.actions.pluginSources as tools, as the signed-in user.
mcpActions:
  name: 'SpechtLabs Backstage'
  description: >-
    Query SpechtLabs' software catalog (components, APIs, resources, systems,
    owners and their relations), see the Kubernetes workloads behind a
    component, search the catalog and TechDocs, and validate or register
    catalog-info.yaml files.
  instructions: >-
    The catalog covers two Kubernetes clusters: specht-labs (Hetzner, GitOps
    from SpechtLabs/k8s-deployment) and labk3s (the homelab k3s cluster).
    Components on labk3s carry a -labk3s suffix when the same app also runs on
    specht-labs (argocd-labk3s, tka-labk3s). Systems group them (homelab,
    observability, and so on); resources include the clusters themselves
    (resource:labk3s) and their storage. Query the catalog before assuming an
    entity exists; use get-catalog-model-description for the entity kinds and
    fields. The Kubernetes tools only see specht-labs.

# Tech Radar: SpechtLabs' stack, in tech-radar.json in this repo. Read from
# GitHub at runtime, so editing it needs no release. Required: the
# tech-radar backend doesn't start without it.
techRadar:
  url: https://github.com/SpechtLabs/backstage/blob/main/tech-radar.json

# Tailscale (packages/backend/src/plugins/tailscale): each tailnet policy
# put together from kind: Tailscale entities, the catalog's Users and Groups,
# and the services' tailnet annotations. A policy entity's spec.publish says
# where its file goes; Backstage writes only to the repositories listed here.
tailscale:
  allowedRepos: []

# Explore: the tools next to the catalog's domains and systems.
explore:
  tools:
    - title: ArgoCD
      description: GitOps for specht-labs, synced from k8s-deployment.
      url: https://argocd.k8s.specht-labs.de
      image: /explore-tool.svg
      tags: [gitops, kubernetes]
    - title: Grafana
      description: Dashboards, alerts and SLOs over the self-hosted LGTM stack.
      url: https://spechtlabs.grafana.net
      image: /explore-tool.svg
      tags: [observability]
    - title: Tailscale admin
      description: The tailnet, its ACLs and devices.
      url: https://login.tailscale.com/admin
      image: /explore-tool.svg
      tags: [network]
    - title: tsidp
      description: Tailscale's OIDC identity provider, behind every sign-in.
      url: https://idp.sphinx-map.ts.net
      image: /explore-tool.svg
      tags: [auth]
    - title: Hetzner Cloud
      description: The servers, volumes, load balancers and object storage.
      url: https://console.hetzner.cloud
      image: /explore-tool.svg
      tags: [infrastructure]
    - title: Cloudflare
      description: DNS for specht-labs.de and the other zones.
      url: https://dash.cloudflare.com
      image: /explore-tool.svg
      tags: [dns]
    - title: Renovate
      description: Dependency dashboards and job logs for the SpechtLabs repos.
      url: https://developer.mend.io/github/SpechtLabs
      image: /explore-tool.svg
      tags: [dependencies]
    - title: GitHub
      description: The SpechtLabs organization.
      url: https://github.com/SpechtLabs
      image: /explore-tool.svg
      tags: [code]

# OpenCost: cost per workload. The cluster config points this at its proxy
# to the in-cluster OpenCost API; this default is for local development.
opencost:
  baseUrl: http://localhost:7007/api/proxy/opencost

# Tech Insights: facts collected hourly, and the scorecard checks over them.
techInsights:
  factRetrievers:
    entityOwnershipFactRetriever:
      cadence: '5 * * * *'
      lifecycle: { timeToLive: { weeks: 2 } }
    entityMetadataFactRetriever:
      cadence: '5 * * * *'
      lifecycle: { timeToLive: { weeks: 2 } }
    techdocsFactRetriever:
      cadence: '5 * * * *'
      lifecycle: { timeToLive: { weeks: 2 } }
    # SpechtLabs conventions (packages/backend/src/modules/techInsights.ts).
    spechtLabsFactRetriever:
      cadence: '10 * * * *'
      lifecycle: { timeToLive: { weeks: 2 } }
  factChecker:
    checks:
      groupOwner:
        type: json-rules-engine
        name: Owned by a group
        description: spec.owner is a Group, not a single User.
        factIds: [entityOwnershipFactRetriever]
        rule:
          conditions:
            all:
              - { fact: hasGroupOwner, operator: equal, value: true }
      description:
        type: json-rules-engine
        name: Has a description
        description: metadata.description says what it is.
        factIds: [entityMetadataFactRetriever]
        rule:
          conditions:
            all:
              - { fact: hasDescription, operator: equal, value: true }
      techdocs:
        type: json-rules-engine
        name: Has TechDocs
        description: Annotated with backstage.io/techdocs-ref.
        factIds: [techdocsFactRetriever]
        rule:
          conditions:
            all:
              - fact: hasAnnotationBackstageIoTechdocsRef
                operator: equal
                value: true
      system:
        type: json-rules-engine
        name: Part of a System
        description: spec.system places it in the catalog's map.
        factIds: [spechtLabsFactRetriever]
        rule:
          conditions:
            all:
              - { fact: hasSystem, operator: equal, value: true }
      github:
        type: json-rules-engine
        name: Linked to its repo
        description: Annotated with github.com/project-slug.
        factIds: [spechtLabsFactRetriever]
        rule:
          conditions:
            all:
              - { fact: hasGithubSlug, operator: equal, value: true }
      renovate:
        type: json-rules-engine
        name: Renovate configured
        description: Its repo has a Renovate config, so dependencies stay current.
        factIds: [spechtLabsFactRetriever]
        rule:
          conditions:
            all:
              - { fact: hasRenovate, operator: equal, value: true }
      argocd:
        type: json-rules-engine
        name: Deployed by ArgoCD
        description: Annotated with argocd/app-name or argocd/app-selector.
        factIds: [spechtLabsFactRetriever]
        rule:
          conditions:
            all:
              - { fact: hasArgocdApp, operator: equal, value: true }
      kubernetes:
        type: json-rules-engine
        name: Shows its workloads
        description: Annotated with a Kubernetes label selector or id.
        factIds: [spechtLabsFactRetriever]
        rule:
          conditions:
            all:
              - { fact: hasKubernetesWorkloads, operator: equal, value: true }

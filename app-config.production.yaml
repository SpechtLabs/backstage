# Production settings baked into the image. Deployment-specific values (URLs,
# the OIDC provider) come from the cluster: k8s-deployment,
# apps/backstage/cluster/<cluster>/app-config.cluster.yaml, loaded after this.

app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: http://localhost:7007

backend:
  # The URL browsers and other clients use to reach the backend.
  baseUrl: http://localhost:7007
  # Object form: the Helm chart sets APP_CONFIG_backend_listen_port, and a
  # string here (':7007') can't merge with it ("got string, wanted object").
  listen:
    port: 7007

  # config options: https://node-postgres.com/apis/client
  # The env vars come from the CNPG-generated Secret <cluster>-app.
  database:
    client: pg
    # One database, one schema per plugin. The default (one database per
    # plugin) would need CREATEDB for the database role.
    pluginDivisionMode: schema
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}

# Sign-in is tsidp only: auth.providers.oidc, set by the cluster config. The
# guest provider from app-config.yaml stays configured (config files merge,
# they can't remove a key), but it refuses every sign-in when NODE_ENV is not
# `development`, and the image sets NODE_ENV=production.
auth:
  environment: production

catalog:
  # Everything else, Backstage's own catalog-info.yaml included, comes from
  # GitHub discovery (catalog.providers.github, in the cluster config).
  # Entities whose source stops emitting them are deleted, not kept: git is
  # the source of truth.
  orphanStrategy: delete
  # Replaces the example locations from app-config.yaml.
  locations:
    - type: file
      target: ./catalog/org.yaml
      rules:
        - allow: [User, Group]

# TechDocs: build in this container (mkdocs is in the image) when a page is
# first opened, and serve from its filesystem. A restart rebuilds on demand.
techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local

# The Grafana plugin (dashboards and alerts on entity pages). The proxy to it,
# with the token, is in the cluster config; until then the cards show an error.
grafana:
  domain: https://spechtlabs.grafana.net
  unifiedAlerting: true

# Users and groups. Sign-in maps the tsidp token's `email` claim (your
# Tailscale login name) to spec.profile.email here, through the
# emailMatchingUserEntityProfileEmail resolver: the two must match exactly.
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: cedi
  annotations:
    # The login in the tailnet policy's groups (cedi/homelab
    # tailscale/policy.hujson).
    specht-labs.de/tailnet-login: cedi@github
spec:
  profile:
    displayName: Cedric Specht
    # TODO: your Tailscale login name, exactly as tsidp's `email` claim has
    # it. A failed sign-in names the email it could not match.
    email: cedi@github.idp.sphinx-map.ts.net
  memberOf:
    - spechtlabs
    - tailnet-admins
    - tailnet-sre
    - tailnet-vpn
    - tailnet-synology-users
    - tailnet-hass-users
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: spechtlabs
spec:
  type: organization
  profile:
    displayName: SpechtLabs
  children: []
# ---------------------------------------------------------------------------
# The tailnet's groups (cedi/homelab tailscale/policy.hujson "groups"), as
# Groups with their members as Users. specht-labs.de/tailnet-group is the
# group's name in the policy, specht-labs.de/tailnet-login a member's login.
# Users without spec.profile.email can't sign in to Backstage: tailnet
# membership doesn't grant Backstage access.
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: x1bay
  annotations:
    specht-labs.de/tailnet-login: x1bay@github
spec:
  memberOf: [tailnet-vpn, tailnet-synology-users]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: x545vpxsbj
  annotations:
    specht-labs.de/tailnet-login: x545vpxsbj@privaterelay.appleid.com
spec:
  memberOf: [tailnet-vpn, tailnet-synology-users, tailnet-hass-users]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: tailnet-admins
  description: Full access to the tailnet; SSH everywhere, root in check mode on core hosts.
  annotations:
    specht-labs.de/tailnet-group: group:admins
spec:
  type: tailnet-group
  profile:
    displayName: Tailnet admins
  parent: spechtlabs
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: tailnet-sre
  description: SSH to the Ceph hosts, compute blades and labk3s nodes; Buckle's UI; Argo CD sign-in through tsidp.
  annotations:
    specht-labs.de/tailnet-group: group:sre
spec:
  type: tailnet-group
  profile:
    displayName: Tailnet SREs
  parent: spechtlabs
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: tailnet-vpn
  description: May use the Mullvad exit nodes.
  annotations:
    specht-labs.de/tailnet-group: group:vpn
spec:
  type: tailnet-group
  profile:
    displayName: Tailnet VPN users
  parent: spechtlabs
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: tailnet-synology-users
  description: DSM and Drive through svc:nas, Jellyfin through svc:stream, Synology sign-in through tsidp.
  annotations:
    specht-labs.de/tailnet-group: group:synology-users
spec:
  type: tailnet-group
  profile:
    displayName: Synology users
  parent: spechtlabs
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: tailnet-hass-users
  description: Home Assistant at home through svc:hass.
  annotations:
    specht-labs.de/tailnet-group: group:hass-users
spec:
  type: tailnet-group
  profile:
    displayName: Home Assistant users
  parent: spechtlabs
  children: []
